[package]
name = "debtrecover"
version = "0.1.0"
description = "Debtrecover desktop shell"
authors = ["N K Lodha & Co"]
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "debtrecover_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-shell = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
